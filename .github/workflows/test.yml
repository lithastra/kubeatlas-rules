name: Test

# Per-PR gate: opa check + opa test for every pack, metadata schema
# validation, and kubeatlas rules-test against every sample set, plus
# the conventional-commits + DCO checks the kubeatlas main repo
# enforces.
#
# Untrusted GitHub event inputs (PR title, commit messages) are
# only read into env vars and quoted on the shell side — never
# interpolated directly in `run:` commands.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  non-ascii-check:
    name: No non-ASCII in source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan rego + yaml for CJK characters
        run: |
          set -e
          if grep -rPnI '[\p{Han}\p{Hiragana}\p{Katakana}\p{Hangul}]' \
               --include='*.rego' --include='*.yaml' --include='*.md' \
               --exclude-dir=docs/zh . 2>/dev/null; then
            echo "::error::Non-ASCII (CJK) characters found in rule pack source."
            echo "Source files (.rego, .yaml, .md) MUST be English."
            exit 1
          fi
          echo "OK: no CJK in tracked source files."

  commitlint:
    name: Commit messages follow Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save @commitlint/cli@19 @commitlint/config-conventional@19
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --extends '@commitlint/config-conventional'
      - name: Validate commits in PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx commitlint \
            --extends '@commitlint/config-conventional' \
            --from "$BASE_SHA" \
            --to "$HEAD_SHA" \
            --verbose

  dco-check:
    name: All commits signed off (DCO)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on each commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          missing=$(git log --format='%H %s' "${BASE_SHA}..${HEAD_SHA}" | while read -r sha rest; do
            if ! git log -1 --format=%B "$sha" | grep -q "^Signed-off-by: "; then
              echo "$sha"
            fi
          done)
          if [ -n "$missing" ]; then
            echo "::error::The following commits are missing a Signed-off-by line:"
            echo "$missing"
            echo "Run: git rebase --signoff main"
            exit 1
          fi
          echo "OK: all commits are signed off."

  opa-check:
    name: opa check + metadata schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Install opa
        run: |
          curl -fsSL -o opa \
            https://openpolicyagent.org/downloads/v1.0.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version
      - name: make check
        run: make check
      - name: validate metadata schema
        run: |
          go build -o /tmp/validate-metadata ./tools/validate-metadata
          /tmp/validate-metadata

  opa-test:
    name: opa test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install opa
        run: |
          curl -fsSL -o opa \
            https://openpolicyagent.org/downloads/v1.0.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
      - name: make test
        run: make test

  kubeatlas-integration:
    name: kubeatlas rules-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeatlas CLI
        env:
          KUBEATLAS_VERSION: v1.5.0
        run: |
          set -euo pipefail
          semver="${KUBEATLAS_VERSION#v}"
          archive="kubeatlas_${semver}_linux_amd64.tar.gz"
          base="https://github.com/lithastra/kubeatlas/releases/download/${KUBEATLAS_VERSION}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          curl -fsSL -o "${tmp}/${archive}" "${base}/${archive}"
          curl -fsSL -o "${tmp}/checksums.txt" "${base}/checksums.txt"
          (cd "${tmp}" && grep -F "${archive}" checksums.txt | sha256sum -c -)
          tar -xzf "${tmp}/${archive}" -C "${tmp}" kubeatlas
          sudo install -m 0755 "${tmp}/kubeatlas" /usr/local/bin/kubeatlas
          kubeatlas --version
      - name: make integration
        run: make integration
