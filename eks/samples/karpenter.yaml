# Real Karpenter NodePool (karpenter.sh/v1) on an EKS cluster.
# spec.template.spec.nodeClassRef points at an EC2NodeClass CR
# (karpenter.k8s.aws/v1) named "default". The rule emits one
# USES_NODE_CLASS edge: NodePool/default-amd64 -> EC2NodeClass/default.
#
# Both NodePool and EC2NodeClass are cluster-scoped, so namespace
# on both ends of the edge is "".
#
# Notes for fixture readers:
#   * spec.template.spec.requirements + taints are Karpenter
#     scheduling settings; the rule ignores them — they don't
#     produce edges to other K8s objects.
#   * spec.disruption is policy config; no edges emitted.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default-amd64
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
      taints: []
      expireAfter: 720h
  limits:
    cpu: 100
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
