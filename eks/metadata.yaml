name: eks
version: 0.1.0
rego_api: v1
kubeatlas: ">= 1.1.0"
description: |
  EKS managed-K8s platform add-on CRDs. Models K8s resources that EKS
  add-ons (AWS Load Balancer Controller, VPC CNI, Karpenter, EKS Pod
  Identity Agent) inject into the cluster.

  This pack does NOT model AWS cloud resources (S3, RDS, IAM Role,
  SQS, SNS, Lambda, etc.). Those describe cloud infrastructure rather
  than the K8s cluster itself, and are explicitly out of scope —
  KubeAtlas reflects the K8s view of a cluster, not the cloud-control-
  plane view. See Phase 3 doc invariant 2.3 + anti-pattern 51b for
  the reasoning trail.

  Like cert-manager, this pack is NOT auto-detected / embedded.
  Operators opt in via Helm:

      rulePacks:
        eks: true

  Anti-pattern reminders for future contributors (see Phase 3
  invariant 2.3 — platform add-on packs are opt-in, never
  auto-loaded; and 51b — cloud-resource wrapper CRDs are out of
  scope):
    * never write rules that read AWS region, account ID, or ARN
      semantics; ARNs may be carried as metadata properties on a
      node but never resolved through aws-sdk-go (invariant 2.7).
    * never emit "guess" edges — only relationships ACK / Crossplane
      / Karpenter spec fields spell out are graph-worthy.
    * never put IRSA (ServiceAccount annotation
      eks.amazonaws.com/role-arn) handling in this rego pack —
      that's a built-in extractor (pkg/extractor/eks_identity.go,
      P3-T23 / F-209) because IRSA is plain SA metadata, not an
      add-on-injected CRD.

  P3R-T1 lands the scaffold + aws-load-balancer-controller module.
  P3R-T2 adds remaining modules one PR at a time:
    * karpenter (NodePool -> EC2NodeClass)
    * pod-identity (PodIdentityAssociation -> ServiceAccount) — this commit
  Two sub-steps from the Phase 3 doc are deliberately skipped:
    * IngressClassParams: the natural edge is IngressClass ->
      IngressClassParams, but IngressClass is a built-in K8s
      resource (networking.k8s.io/v1) — that belongs in the
      main repo's pkg/extractor, not in a rego pack matching
      kind=IngressClassParams (which has no outbound refs).
    * vpc-cni / ENIConfig: spec fields are AWS subnet + SG IDs
      (cloud resources, out of scope per invariant 51b). CRD
      auto-discovery (Phase 2 F-103) already creates the node;
      a no-op rego module adds nothing.
maintainers:
  - "@kubeatlas-maintainers"
modules:
  - name: aws-load-balancer-controller
    file: aws-load-balancer-controller.rego
    entrypoint: data.kubeatlas.rules.eks.aws_load_balancer_controller.derive
    match:
      group: elbv2.k8s.aws
      kind: TargetGroupBinding
  - name: karpenter
    file: karpenter.rego
    entrypoint: data.kubeatlas.rules.eks.karpenter.derive
    match:
      group: karpenter.sh
      kind: NodePool
  - name: pod-identity
    file: pod-identity.rego
    entrypoint: data.kubeatlas.rules.eks.pod_identity.derive
    match:
      group: eks.amazonaws.com
      kind: PodIdentityAssociation
