name: openshift
version: 0.1.0
rego_api: v1
kubeatlas: ">= 1.0.0"
description: |
  OpenShift platform CRDs. v0.1.0 ships the Route module only;
  P2R-T4 adds DC / BC / IS / SCC. The same content is embedded in
  the kubeatlas binary so the engine auto-loads this pack when
  the OpenShift API-group detector sees route.openshift.io.
maintainers:
  - "@kubeatlas-maintainers"
modules:
  - name: route
    file: route.rego
    entrypoint: data.kubeatlas.rules.openshift.route.derive
    match:
      group: route.openshift.io
      kind: Route
