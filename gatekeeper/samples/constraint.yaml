# Sample Constraint that sources its parameters from a ConfigMap.
# `kubeatlas rules-test` evaluates the pack against this and expects a
# REFERENCES_PARAM edge to gatekeeper-system/ConfigMap/required-labels.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredLabels
metadata:
  name: all-must-have-owner
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Namespace"]
  parameters:
    configMap:
      namespace: gatekeeper-system
      name: required-labels
