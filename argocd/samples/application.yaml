# An Argo CD Application syncing the guestbook app. The application
# rule emits three edges: BELONGS_TO_PROJECT (-> AppProject default),
# DEPLOYS_TO (-> Namespace guestbook) and SOURCED_FROM (-> GitRepo,
# the repoURL).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    path: guestbook
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
